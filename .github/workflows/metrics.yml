name: GitHub Metrics

on:
  schedule:
    # Run daily at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: OussamaHaimour
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Casablanca
          config_order: base.header, isocalendar, languages, habits
          output_action: commit
          committer_message: "chore: update github-metrics.svg [skip ci]"
          
          # Lines of code plugin
          plugin_lines: yes
          plugin_lines_history_limit: 2
          
          # Languages plugin
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14
          plugin_languages_details: lines, percentage
          
          # Isometric Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Coding habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
